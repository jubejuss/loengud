[project]
name = "loengud"
version = "0.1.0"
description = "Loengusalvestuste töövoog: Teams → TalTech ASR (tekstiks.ee mootor) → YouTube subtiitrid + transkriptsioon loengurepos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6",
  "certifi>=2024.0",
  "google-api-python-client>=2.100",
  "google-auth-oauthlib>=1.0",
  "google-auth-httplib2>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
loengud = "loengud.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
